name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에서 새 실행이 시작되면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 문서(.md·docs/·.github/images/)만 바뀌었는지 판별
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 비교 기준 커밋이 필요함

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 비교 실패·변경 없음이면 테스트 실행
          if files=$(git diff --name-only "$BASE" "$GITHUB_SHA") && [ -n "$files" ] \
            && ! grep -qvE '\.md$|^docs/|^\.github/images/' <<< "$files"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    # skip된 job은 필수 체크를 통과로 처리, changes 실패 시에는 테스트 실행
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # 로컬에서 쓰는 Xcode 버전과 맞추기
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true   # Gemfile.lock 기준으로 설치 + 캐시

      # gitignore된 Secrets.xcconfig·Firebase plist 복원
      - name: Restore secrets
        env:
          APP_SECRETS: ${{ secrets.APP_SECRETS }}
        run: echo "$APP_SECRETS" | base64 --decode | tar xzf - -C Danogotchi/App

      - name: Build & test
        run: bundle exec fastlane test
        env:
          # SPM 패키지가 많아 showBuildSettings가 느림
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
